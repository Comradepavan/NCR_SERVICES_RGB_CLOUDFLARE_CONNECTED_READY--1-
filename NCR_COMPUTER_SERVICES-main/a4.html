<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation | NCR SERVICES</title><link rel="stylesheet" href="app.css"><style>
@page{size:A4 portrait;margin:0}html,body{margin:0;background:#eaf1f7}.print-toolbar,.quote-actions{max-width:210mm;margin:12px auto}.sheet-wrap{overflow:auto}.doc-sheet{position:relative;width:210mm;height:297mm;margin:0 auto;background:#fff url('assets/quotation-background.jpg') center/100% 100% no-repeat;overflow:hidden;color:#062b56;font-family:Arial,Helvetica,sans-serif;box-sizing:border-box}.layer{position:absolute;inset:0}.box{position:absolute;box-sizing:border-box;background:rgba(255,255,255,.97);border:1px solid #9dbbd4;border-radius:3mm;box-shadow:0 1mm 3mm rgba(0,38,75,.08)}.customer{left:6mm;top:39mm;width:91mm;height:34mm;padding:3.5mm}.customer h3,.warranty h3{margin:0 0 2mm;font-size:9pt}.customer .row{display:grid;grid-template-columns:28mm 3mm 1fr;align-items:center;min-height:7mm;border-bottom:1px solid #dbe7ef;font-size:7.4pt}.label{font-weight:800;color:#55728c}.value{font-weight:900;color:#052b57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.serial{left:101mm;top:38.5mm;width:63mm;height:20mm;padding:2.5mm 3mm}.serial .slabel{font-size:7pt;font-weight:800}.serial .sval{font-size:8.5pt;font-weight:900}.serial .bar{margin-top:1mm}.series-barcode{display:block;background:#fff}.date{left:166mm;top:38.5mm;width:38mm;height:10mm;padding:2.5mm 2.5mm;font-size:7.3pt}.warranty{left:101mm;top:58.5mm;width:103mm;height:20mm;padding:2.4mm 3mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.warranty h3{margin:0 0 1mm}.warranty p{margin:0;line-height:1.45;white-space:normal}.warranty p{margin:0;font-size:6.7pt;font-weight:800;line-height:1.45}.items{position:absolute;left:6mm;top:81mm;width:198mm;height:73mm;overflow:hidden;border:1px solid #88b1cf;border-radius:3mm;background:rgba(255,255,255,.95)}table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #88b1cf}table th,table td{border-left:1px solid #c9ddea;border-right:1px solid #c9ddea;box-sizing:border-box}.items th{height:8mm;background:#062c56;color:#fff;font-size:6.8pt}.items th:nth-child(1){width:11mm}.items th:nth-child(3){width:18mm}.items th:nth-child(4){width:17mm}.items th:nth-child(5){width:30mm}.items th:nth-child(6){width:30mm}.items td{height:10.3mm;border-top:1px solid #c9ddea;font-size:6.9pt;padding:1mm 1.5mm}.items td:first-child{text-align:center;font-weight:900}.items td:nth-child(n+3){text-align:center}.items td:nth-child(5),.items td:nth-child(6){text-align:right;padding-right:3mm}.iname{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.idesc{font-size:5.8pt;color:#55708a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.terms{position:absolute;left:6mm;top:173mm;width:130mm;height:30mm;padding:3mm;background:rgba(255,255,255,.95);border:1px solid #b3cadc;border-radius:3mm;font-size:6.7pt;line-height:1.55}.terms b{font-size:7.7pt}.totals{position:absolute;left:140mm;top:173mm;width:64mm;height:24mm;background:rgba(255,255,255,.97);border:1px solid #9dbbd4;border-radius:3mm;overflow:hidden}.tr{display:flex;justify-content:space-between;padding:2mm 2.7mm;font-size:7.5pt;border-bottom:1px solid #d7e4ed}.tr.total{background:linear-gradient(90deg,#062c56,#0d496d);color:#fff;font-size:9.3pt;font-weight:900}.bottom-bar{position:absolute;left:77mm;top:198mm;width:57mm;height:15mm;background:#fff;padding:1mm;border-radius:1.5mm}.bottom-bar svg{width:100%;height:100%}.signature{position:absolute;left:172mm;top:199mm;width:31mm;text-align:center;font-size:6.2pt;font-weight:800;color:#174c78}.no-print{display:block}@media print{html,body{width:210mm!important;height:297mm!important;background:#fff!important;overflow:hidden!important}.no-print{display:none!important}.doc-sheet{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:210mm!important;height:297mm!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="print-toolbar no-print"><div class="surface" style="padding:14px"><div class="section-head"><div><b>NCR SERVICES</b><div class="muted">Professional A4 quotation • clean print layout</div></div><div class="actions"><button class="btn blue" onclick="window.print()">Print / Save PDF</button><button class="btn green" id="quoteWa">💬 Send Quotation WhatsApp</button><a class="btn ghost" href="quotation.html">Back</a></div></div></div></div>
<div class="sheet-wrap"><section class="doc-sheet"><div id="docContent" class="layer"></div></section></div>
<script src="api-config.js"></script><script src="app.js?v=12"></script><script>
function qdate(v){return new Date(v||Date.now()).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})}function qimg(it){const src=asset(it);return src?'<img src="'+esc(src)+'" style="width:10mm;height:7mm;object-fit:contain;float:left;margin-right:2mm" onerror="this.style.display=\'none\'">':''}
document.addEventListener('DOMContentLoaded',async()=>{let q=null,items=[];const id=new URLSearchParams(location.search).get('id');try{if(id&&!id.startsWith('local-')){q=await api('/quotes/'+encodeURIComponent(id));items=q.items||[]}}catch{}if(!q){try{const x=JSON.parse(localStorage.getItem('ncr_quote_preview')||'null');if(x){q=x.quote;items=x.items||[]}}catch{}}if(!q){$('#docContent').innerHTML='<div style="padding:20mm"><h2>Quotation not available</h2></div>';return}$('#quoteWa').onclick=()=>orderNotify.quoteWhatsApp(q);const total=Math.max(0,Number(q.subtotal||0)-Number(q.discount||0));const rows=items.slice(0,6).map((it,i)=>'<tr><td>'+String(i+1)+'</td><td>'+qimg(it)+'<div class="iname">'+esc(it.name||'Item')+'</div><div class="idesc">'+esc(it.sku||'')+'</div></td><td>'+esc(it.hsn||'—')+'</td><td>'+Number(it.qty||0)+'</td><td>'+money(it.price)+'</td><td>'+money(Number(it.price||0)*Number(it.qty||0))+'</td></tr>').join('');$('#docContent').innerHTML='<div class="box customer"><h3>👤 CUSTOMER DETAILS</h3><div class="row"><span class="label">Customer Name</span><span>:</span><span class="value">'+esc(q.customer_name)+'</span></div><div class="row"><span class="label">Mobile No.</span><span>:</span><span class="value">'+esc(q.phone)+'</span></div><div class="row"><span class="label">Email</span><span>:</span><span class="value">'+esc(q.email||'—')+'</span></div></div><div class="box serial"><div class="slabel">Quotation No. : <span class="sval">'+esc(q.quote_no||'')+'</span></div><div class="bar">'+barcodeSvg(q.quote_no||'NCR/QUO',360,48)+'</div></div><div class="box date">📅 <b>Date</b> : '+qdate(q.created_at)+'</div><div class="box warranty"><h3>🛡️ WARRANTY DETAILS</h3><p>All items under 2 years warranty</p><p>🔵 1st Year : Piece to piece replacement warranty</p><p>🔵 2nd Year : Service warranty</p></div><div class="items"><table><thead><tr><th>S.No</th><th>Product Name / Description</th><th>HSN Code</th><th>Qty</th><th>Unit Price (₹)</th><th>Total Price (₹)</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6">No items</td></tr>')+'</tbody></table></div><div class="terms"><b>▣ Terms &amp; Conditions</b><br>• Quotation is valid for 15 days from the date of issue.<br>• Prices are subject to change without prior notice.<br>• Payment terms: 50% Advance, 50% Before Delivery.<br>• Warranty as stated above.<br>• No GST / tax is applied.</div><div class="totals"><div class="tr"><span>Sub Total</span><b>'+money(q.subtotal)+'</b></div><div class="tr"><span>Discount</span><b>'+money(q.discount||0)+'</b></div><div class="tr total"><span>Grand Total</span><b>'+money(total)+'</b></div></div><div class="bottom-bar">'+barcodeSvg(q.quote_no||'NCR/QUO',480,70)+'</div><div class="signature">Authorised Signatory<br>For NCR SERVICES</div>'});
</script></body></html>
