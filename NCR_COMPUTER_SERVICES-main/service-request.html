<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Service | NCR SERVICES</title><link rel="stylesheet" href="app.css"></head><body><header class="header"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.png" alt="NCR SERVICES">NCR SERVICES</a><nav class="navlinks"><a href="index.html">Home</a><a href="products.html">Products</a><a href="services.html">Services</a><a href="quotation.html">Quotation</a><a href="contact.html">Contact</a><a href="cart.html">Cart <span class="cart-count">0</span></a></nav></div></header><main class="page"><div class="wrap"><div class="section-head"><div><span class="eyebrow" style="background:#edf9f4;color:#08794e;border-color:#c9ecdc">BOOK SERVICE</span><h1>Request a Service</h1></div></div><div class="surface" style="max-width:820px;padding:24px"><div id="msg"></div><div class="form-grid"><input class="input" id="name" placeholder="Customer Name *"><input class="input" id="phone" placeholder="Mobile Number *"><input class="input" id="email" type="email" placeholder="Email"><input class="input" id="date" type="date"></div><input class="input" id="service" style="margin-top:12px" placeholder="Service Needed *"><textarea class="input" id="problem" style="margin-top:12px" placeholder="Problem / requirement *"></textarea><textarea class="input" id="address" style="margin-top:12px" placeholder="Address"></textarea><button id="serviceSubmit" type="button" class="btn green" style="margin-top:12px" onclick="sendService()">📨 Submit Service Request</button><div class="muted" style="margin-top:9px;font-size:11px">Your request is sent securely to the NCR SERVICES service desk.</div></div></div></main><script src="api-config.js"></script><script src="app.js?v=12"></script><script>let serviceSending=false;async function sendService(){if(serviceSending)return;serviceSending=true;const btn=$('#serviceSubmit');if(btn)btn.disabled=true;const payload={customer_name:$('#name').value.trim(),phone:$('#phone').value.trim(),email:$('#email').value.trim(),preferred_date:$('#date').value,service:$('#service').value.trim(),problem:$('#problem').value.trim(),address:$('#address').value.trim(),request_id:requestId('service')};try{const d=await api('/service-requests',{method:'POST',body:JSON.stringify(payload)});$('#msg').innerHTML='<div class="notice ok">✅ Request '+esc(d.request.request_no)+' submitted successfully. We will contact you.</div>';if(btn){btn.textContent='✅ Request Submitted';btn.disabled=true}}catch(e){serviceSending=false;if(btn)btn.disabled=false;$('#msg').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}</script></body></html>
