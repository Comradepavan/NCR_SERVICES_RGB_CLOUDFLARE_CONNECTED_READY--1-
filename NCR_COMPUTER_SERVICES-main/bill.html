<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bill / Invoice | NCR SERVICES</title><link rel="stylesheet" href="app.css"><style>
@page{size:A4 portrait;margin:0}.sheet-wrap{overflow:auto}.doc-sheet{position:relative;width:210mm;height:297mm;margin:0 auto;background:#fff url('assets/invoice-background.jpg') center/100% 100% no-repeat;overflow:hidden;color:#062b56;font-family:Arial,Helvetica,sans-serif}.doc-content{position:absolute;inset:0}.box{position:absolute;box-sizing:border-box;background:rgba(255,255,255,.97);border:1px solid #9dbbd4;border-radius:3mm;box-shadow:0 1mm 3mm rgba(0,38,75,.08)}.customer{left:6mm;top:39mm;width:91mm;height:34mm;padding:3.5mm}.customer h3,.warranty h3{margin:0 0 2mm;font-size:9pt}.customer .row{display:grid;grid-template-columns:28mm 3mm 1fr;align-items:center;min-height:7mm;border-bottom:1px solid #dbe7ef;font-size:7.4pt}.label{font-weight:800;color:#55728c}.value{font-weight:900;color:#052b57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.serial{left:101mm;top:38.5mm;width:63mm;height:20mm;padding:2.5mm 3mm}.serial .slabel{font-size:7pt;font-weight:800}.serial .sval{font-size:8.5pt;font-weight:900}.serial .bar{margin-top:1mm}.series-barcode{display:block;background:#fff}.date{left:166mm;top:38.5mm;width:38mm;height:10mm;padding:2.5mm 2.5mm;font-size:7.3pt}.warranty{left:101mm;top:58.5mm;width:103mm;height:20mm;padding:2.4mm 3mm;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.warranty h3{margin:0 0 1mm}.warranty p{margin:0;line-height:1.45;white-space:normal}.warranty p{margin:0;font-size:6.7pt;font-weight:800;line-height:1.45}.items{position:absolute;left:6mm;top:81mm;width:198mm;height:73mm;overflow:hidden;border:1px solid #88b1cf;border-radius:3mm;background:rgba(255,255,255,.95)}table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #88b1cf}table th,table td{border-left:1px solid #c9ddea;border-right:1px solid #c9ddea;box-sizing:border-box}.items th{height:8mm;background:#062c56;color:#fff;font-size:6.8pt}.items th:nth-child(1){width:11mm}.items th:nth-child(3){width:18mm}.items th:nth-child(4){width:17mm}.items th:nth-child(5){width:30mm}.items th:nth-child(6){width:30mm}.items td{height:10.3mm;border-top:1px solid #c9ddea;font-size:6.9pt;padding:1mm 1.5mm}.items td:first-child{text-align:center;font-weight:900}.items td:nth-child(n+3){text-align:center}.items td:nth-child(5),.items td:nth-child(6){text-align:right;padding-right:3mm}.item-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-sku{font-size:5.8pt;color:#55708a}.terms{position:absolute;left:6mm;top:173mm;width:130mm;height:30mm;padding:3mm;background:rgba(255,255,255,.95);border:1px solid #b3cadc;border-radius:3mm;font-size:6.7pt;line-height:1.55}.terms b{font-size:7.7pt}.totals{position:absolute;left:140mm;top:173mm;width:64mm;height:24mm;background:rgba(255,255,255,.97);border:1px solid #9dbbd4;border-radius:3mm;overflow:hidden}.tr{display:flex;justify-content:space-between;padding:2mm 2.7mm;font-size:7.5pt;border-bottom:1px solid #d7e4ed}.tr.total{background:linear-gradient(90deg,#062c56,#0d496d);color:#fff;font-size:9.3pt;font-weight:900}.bottom-bar{position:absolute;left:77mm;top:198mm;width:57mm;height:15mm;background:#fff;padding:1mm;border-radius:1.5mm}.bottom-bar svg{width:100%;height:100%}.bill-qr{position:absolute;left:132mm;top:198mm;width:32mm;height:32mm;background:#fff;border:1px solid #9dbbd4;border-radius:2mm;padding:1.5mm;box-sizing:border-box;text-align:center;font-size:5.2pt;color:#174c78;z-index:5}.bill-qr img{display:block;width:25mm;height:25mm;margin:0 auto 0.8mm}.signature{position:absolute;left:172mm;top:199mm;width:31mm;text-align:center;font-size:6.2pt;font-weight:800;color:#174c78}.notify-panel{max-width:210mm;margin:12px auto}.notify-grid{display:flex;flex-wrap:wrap;gap:8px}.notify-title{font-size:15px;font-weight:900}.notify-note{font-size:12px;color:#64748b;margin:4px 0 10px}.no-print{display:block}@media print{html,body{width:210mm!important;height:297mm!important;background:#fff!important;overflow:hidden!important}.no-print{display:none!important}.doc-sheet{position:absolute!important;left:0!important;top:0!important;margin:0!important;width:210mm!important;height:297mm!important;box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="print-toolbar no-print"><div class="surface" style="padding:14px;max-width:210mm;margin:12px auto"><div class="section-head"><div><b>NCR SERVICES</b><div class="muted">Professional bill / invoice • A4 print</div></div><div class="actions"><button class="btn blue" onclick="window.print()">Print / Save PDF</button><a class="btn ghost" href="products.html">Products</a></div></div></div></div>
<div id="notifyPanel" class="notify-panel no-print" style="display:none"><div class="surface" style="padding:14px"><div class="notify-title">Invoice notification actions</div><div class="notify-note">WhatsApp opens a pre-filled message with the secure invoice PDF link. No WhatsApp API is used.</div><div class="notify-grid"><button class="btn green" id="waCustomer">💬 Customer WhatsApp</button><button class="btn yellow" id="waBillPdf">📄 Send Invoice PDF WhatsApp</button><button class="btn green" id="waBusiness">💬 My WhatsApp</button><button class="btn blue" id="smsCustomer">📱 Customer SMS</button><button class="btn ghost" id="emailCustomer">✉ Customer Email</button></div></div></div>
<div class="sheet-wrap"><section class="doc-sheet"><div id="docContent" class="doc-content"></div></section></div>
<script src="api-config.js"></script><script src="app.js?v=12"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{const t=new URLSearchParams(location.search).get('token');let o=null;if(t&&t!=='local'){try{o=await api('/bills/'+encodeURIComponent(t))}catch(e){}}if(!o){try{o=JSON.parse(localStorage.getItem('ncr_invoice_preview')||localStorage.getItem('ncr_last_order')||'null')}catch{}}if(!o){$('#docContent').innerHTML='<div style="padding:12mm"><h2>Bill / invoice not available.</h2></div>';return}
 const qr=$('#billQr'),qri=$('#billQrImg');if(qr&&qri&&o.bill_token){qri.src=apiUrl('/bills/'+encodeURIComponent(o.bill_token)+'/qr.svg');qr.style.display='block'}const total=Math.max(0,Number(o.subtotal||0)-Number(o.discount||0));const rows=(o.items||[]).slice(0,6).map((it,i)=>'<tr><td>'+String(i+1)+'</td><td><div class="item-name">'+esc(it.name||'Item')+'</div><div class="item-sku">'+esc(it.sku||'')+'</div></td><td>'+esc(it.hsn||'—')+'</td><td>'+Number(it.qty||0)+'</td><td>'+money(it.price)+'</td><td>'+money(Number(it.price||0)*Number(it.qty||0))+'</td></tr>').join('');$('#docContent').innerHTML='<div class="box customer"><h3>👤 CUSTOMER DETAILS</h3><div class="row"><span class="label">Customer Name</span><span>:</span><span class="value">'+esc(o.customer_name)+'</span></div><div class="row"><span class="label">Mobile No.</span><span>:</span><span class="value">'+esc(o.phone)+'</span></div><div class="row"><span class="label">Email</span><span>:</span><span class="value">'+esc(o.email||'—')+'</span></div></div><div class="box serial"><div class="slabel">Invoice No. : <span class="sval">'+esc(o.invoice_no||'')+'</span></div><div style="font-size:7pt;font-weight:800;margin-top:1mm">Payment: <b>"'+esc(o.payment_method||'')+'"</b><br>Status: <b>"'+esc(o.payment_status||'Pending')+'"</b></div><div class="bar">'+barcodeSvg(o.invoice_no||'NCR/INV',360,48)+'</div></div><div class="box date">📅 <b>Date</b> : '+new Date(o.created_at||Date.now()).toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})+'</div><div class="box warranty"><h3>🛡️ WARRANTY DETAILS</h3><p>All items under 2 years warranty</p><p>🔵 1st Year : Piece to piece replacement warranty</p><p>🔵 2nd Year : Service warranty</p></div><div class="items"><table><thead><tr><th>S.No</th><th>Product Name / Description</th><th>HSN Code</th><th>Qty</th><th>Unit Price (₹)</th><th>Total Price (₹)</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="terms"><b>✓ Terms &amp; Conditions</b><br>• Invoice is valid for the supplied items.<br>• Warranty applies as stated above.<br>• Please retain the invoice serial for service support.<br>• Total = Subtotal − Discount.<br>• No GST / tax is applied.</div><div class="totals"><div class="tr"><span>Sub Total</span><b>'+money(o.subtotal)+'</b></div><div class="tr"><span>Discount</span><b>'+money(o.discount||0)+'</b></div><div class="tr total"><span>Grand Total</span><b>'+money(total)+'</b></div></div><div class="bottom-bar">'+barcodeSvg(o.invoice_no||'NCR/INV',480,70)+'</div><div class="bill-qr" id="billQr" style="display:none"><img id="billQrImg" alt="Scan to download bill PDF"><b>SCAN TO DOWNLOAD BILL PDF</b></div><div class="signature">Authorised Signatory<br>For NCR SERVICES</div>';
 const notify=new URLSearchParams(location.search).get('notify');if(notify){$('#notifyPanel').style.display='block';$('#waCustomer').onclick=()=>orderNotify.customerWhatsApp(o);$('#waBillPdf').onclick=()=>orderNotify.customerBillWhatsApp(o);$('#waBusiness').onclick=()=>orderNotify.businessWhatsApp(o);$('#smsCustomer').onclick=()=>orderNotify.customerSms(o);$('#emailCustomer').onclick=()=>orderNotify.customerEmail(o)}});
</script></body></html>
