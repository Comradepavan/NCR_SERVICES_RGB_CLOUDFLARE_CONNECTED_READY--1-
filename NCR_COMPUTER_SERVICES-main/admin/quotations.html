<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html" style="color:#fff"><img src="../assets/logo.png" alt="NCR ADMIN">NCR ADMIN</a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products & Stock</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow" style="background:#fff8e5;color:#8b6500;border-color:#ffe3a1">QUOTATION DESK</span><h1>Quotations</h1><p class="muted">Customer quotation records.</p></div><button class="btn blue" onclick="loadData()">Refresh</button></div><div class="surface" style="padding:18px"><div id="list" class="table-wrap"><div class="loading">Loading data…</div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(requireAdmin())loadData()});async function deleteQuote(id){if(!confirm('Delete this quotation permanently?'))return;try{await api('/admin/quotes/'+id,{method:'DELETE'});loadData()}catch(e){alert(e.message)}}async function sendQuoteWhatsApp(id){try{const q=await api('/quotes/'+id);orderNotify.quoteWhatsApp(q)}catch(e){alert(e.message)}}async function loadData(){const el=$('#list');el.innerHTML='<div class="loading">Loading data…</div>';try{const d=await api('/admin/quotes');const qs=d.quotes||[];el.innerHTML=qs.length?'<table class="table"><tr><th>Quotation</th><th>Customer</th><th>Mobile</th><th>Total</th><th>Status</th><th>Actions</th></tr>'+qs.slice().reverse().map(x=>'<tr><td>'+esc(x.quote_no)+'</td><td>'+esc(x.customer_name)+'</td><td>'+esc(x.phone)+'</td><td>'+money(x.total)+'</td><td>'+esc(x.status)+'</td><td><a class="btn ghost" href="../a4.html?id='+x.id+'" target="_blank">View</a> <button class="btn green" onclick="sendQuoteWhatsApp('+x.id+')">WhatsApp PDF</button> <button class="btn danger" onclick="deleteQuote('+x.id+')">Delete</button></td></tr>').join('')+'</table>':'<div class="notice">No quotations found.</div>'}catch(e){el.innerHTML='<div class="notice error">'+esc(e.message)+'<br><button class="btn ghost" onclick="loadData()">Retry</button></div>'}}</script></body></html>
