<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html"><img src="../assets/logo.png" alt="NCR ADMIN">NCR SERVICES <span style="font-size:10px;color:#71d9ff">ADMIN</span></a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow">ORDER CONTROL</span><h1>Orders</h1><p class="muted">Open bills, contact customers, update status, or remove old records.</p></div><div class="actions"><button class="btn blue" onclick="loadData()">↻ Refresh</button><button class="btn danger" onclick="clearAll()">Clear All Orders</button></div></div><div class="surface" style="padding:18px"><div id="list" class="table-wrap"><div class="loading">Loading orders…</div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>
document.addEventListener('DOMContentLoaded',()=>{if(requireAdmin())loadData()});
async function loadData(){const el=$('#list');el.innerHTML='<div class="loading">Loading orders…</div>';try{const d=await api('/admin/orders');const rows=d.orders||[];el.innerHTML=rows.length?'<table class="table"><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Actions</th></tr>'+rows.slice().reverse().map(x=>{const e=encodeURIComponent(JSON.stringify(x));return '<tr><td><b>'+esc(x.invoice_no)+'</b><br><small>'+esc(x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'')+'</small></td><td>'+esc(x.customer_name)+'<br>'+esc(x.phone)+'</td><td><b>'+money(x.total)+'</b></td><td><b>'+esc(x.payment_method||'Not selected')+'</b><br><small class="muted">'+esc(x.payment_status||'Pending')+'</small></td><td><select class="input" style="min-width:125px" onchange="setStatus('+x.id+',this.value)"><option '+(x.status==='Pending'?'selected':'')+'>Pending</option><option '+(x.status==='Processing'?'selected':'')+'>Processing</option><option '+(x.status==='Completed'?'selected':'')+'>Completed</option><option '+(x.status==='Cancelled'?'selected':'')+'>Cancelled</option></select></td><td><div class="actions"><a class="btn blue" target="_blank" href="../bill.html?token='+encodeURIComponent(x.bill_token)+'">Bill</a><a class="btn ghost" target="_blank" href="'+esc(billPdfUrl(x))+'">📄 PDF</a><button class="btn green" onclick="orderNotifyEncoded(\''+e+'\',\'customerBillWhatsApp\')">WhatsApp Bill</button><button class="btn danger" onclick="deleteOrder('+x.id+')">Delete</button></div></td></tr>'}).join('')+'</table>':'<div class="notice">No orders found.</div>'}catch(e){el.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function setStatus(id,status){try{await api('/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});toast('Order status updated')}catch(e){try{await api('/admin/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status})});toast('Order status updated')}catch(e2){toast('Status update failed: '+e2.message);loadData()}}}
async function deleteOrder(id){if(!confirm('Delete this order record?'))return;try{await api('/admin/orders/'+id,{method:'DELETE'});loadData()}catch(e){alert(e.message)}}
async function clearAll(){const d=await api('/admin/orders');if(!d.orders?.length)return alert('There are no orders to clear.');if(!confirm('Delete ALL '+d.orders.length+' existing orders? This cannot be undone.'))return;try{await api('/admin/orders',{method:'DELETE'});loadData()}catch(e){alert(e.message)}}
</script></body></html>
