<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Service Requests | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html"><img src="../assets/logo.png" alt="NCR ADMIN">NCR SERVICES <span style="font-size:10px;color:#71d9ff">ADMIN</span></a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow">SERVICE DESK</span><h1>Customer Service Requests</h1><p class="muted">Reply, take action, mark solved, or remove completed requests.</p></div><div class="actions"><button class="btn blue" onclick="loadData()">↻ Refresh</button><button class="btn danger" onclick="clearAll()">Clear All</button></div></div><div class="surface" style="padding:18px"><div id="list" class="service-list"><div class="loading">Loading requests…</div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>
document.addEventListener('DOMContentLoaded',()=>{if(requireAdmin())loadData()});
async function loadData(){const el=$('#list');el.innerHTML='<div class="loading">Loading requests…</div>';try{const d=await api('/admin/services');const rs=d.requests||[];el.innerHTML=rs.length?rs.slice().reverse().map(x=>{const e=encodeURIComponent(JSON.stringify(x));return '<article class="surface" style="padding:18px;margin-bottom:14px;border-left:4px solid '+(x.status==='Solved'||x.status==='Closed'?'#16a34a':'#ff9900')+'"><div class="section-head"><div><b>'+esc(x.request_no)+'</b><div class="muted">'+esc(x.customer_name)+' • '+esc(x.phone)+'</div></div><span class="pill">'+esc(x.status||'New')+'</span></div><div class="detail" style="margin-top:12px"><div><p><b>Service:</b> '+esc(x.service)+'</p><p><b>Problem:</b> '+esc(x.problem)+'</p><p><b>Address:</b> '+esc(x.address||'—')+'</p><p class="muted">Received: '+esc(x.created_at?new Date(x.created_at).toLocaleString('en-IN'):'')+'</p></div><div><label class="muted">Action / status</label><select id="st-'+x.id+'" class="input"><option '+(x.status==='New'?'selected':'')+'>New</option><option '+(x.status==='In Progress'?'selected':'')+'>In Progress</option><option '+(x.status==='Waiting for Customer'?'selected':'')+'>Waiting for Customer</option><option '+(x.status==='Solved'?'selected':'')+'>Solved</option><option '+(x.status==='Closed'?'selected':'')+'>Closed</option></select><label class="muted" style="display:block;margin-top:8px">Reply to customer</label><textarea id="rp-'+x.id+'" class="input" rows="4" placeholder="Write your reply / action taken...">'+esc(x.admin_reply||'')+'</textarea><div class="actions" style="margin-top:8px"><button class="btn blue" onclick="saveService('+x.id+')">Save Action</button><button class="btn green" onclick="replyWhatsApp('+e+')">WhatsApp Reply</button><button class="btn danger" onclick="deleteService('+x.id+')">Delete</button></div></div></div></article>'}).join(''):'<div class="notice">No service requests found.</div>'}catch(e){el.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function saveService(id){try{const status=$('#st-'+id).value,admin_reply=$('#rp-'+id).value.trim();await api('/admin/services/'+id,{method:'PATCH',body:JSON.stringify({status,admin_reply})});loadData()}catch(e){alert(e.message)}}
function replyWhatsApp(x){const reply=$('#rp-'+x.id)?.value.trim()||x.admin_reply||'';if(!reply)return alert('Write a reply first.');openWhatsApp(x.phone,`Hello ${x.customer_name},\n\nNCR SERVICES service request ${x.request_no}:\n${reply}\n\nThank you, NCR SERVICES.`)}
async function deleteService(id){if(!confirm('Delete this service request?'))return;try{await api('/admin/services/'+id,{method:'DELETE'});loadData()}catch(e){alert(e.message)}}
async function clearAll(){const d=await api('/admin/services');if(!d.requests?.length)return alert('There are no service requests to clear.');if(!confirm('Delete all '+d.requests.length+' service requests?'))return;try{await api('/admin/services',{method:'DELETE'});loadData()}catch(e){alert(e.message)}}
</script></body></html>
