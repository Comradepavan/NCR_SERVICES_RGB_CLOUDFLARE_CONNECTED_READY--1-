<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html" style="color:#fff"><img src="../assets/logo.png" alt="NCR ADMIN">NCR ADMIN</a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products & Stock</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow" style="background:#eaf4ff;color:#0b63ce;border-color:#cfe2ff">CATALOG</span><h1>Categories</h1></div><button class="btn blue" onclick="loadData()">Refresh</button></div><div class="surface" style="padding:18px"><div id="list"><div class="loading">Loading data…</div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(requireAdmin())loadData()});async function loadData(){try{const d=await api('/admin/categories');$('#list').innerHTML='<div class="products">'+d.categories.map(x=>'<a class="surface" style="padding:20px" href="products.html"><span class="pill">CATEGORY</span><h2>'+esc(x.category)+'</h2><p class="muted">'+x.count+' products • '+x.units+' units</p><b>'+money(x.stock_value)+'</b></a>').join('')+'</div>'}catch(e){$('#list').innerHTML='<div class="notice error">'+esc(e.message)+'<br><button class="btn ghost" onclick="loadData()">Retry</button></div>'}}</script></body></html>
