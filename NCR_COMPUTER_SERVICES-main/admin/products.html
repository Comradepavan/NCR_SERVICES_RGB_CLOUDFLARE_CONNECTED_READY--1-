<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Products & Stock | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html"><img src="../assets/logo.png" alt="NCR ADMIN">NCR SERVICES <span style="font-size:10px;color:#71d9ff">ADMIN</span></a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow">CATALOG CONTROL</span><h1>Products & Stock</h1><p class="muted">Add products once. Select multiple photos at once; the first photo is used as the main product photo.</p></div><button class="btn yellow" onclick="openForm()">＋ Add Product</button></div><div class="surface" style="padding:18px"><div id="msg"></div><div id="list" class="table-wrap"><div class="loading">Loading products…</div></div></div><div id="modal" class="modal"><div class="modal-box"><div class="section-head"><div><span class="eyebrow">PRODUCT</span><h2 id="ft">Add Product</h2></div><button class="btn ghost" onclick="closeForm()">Close</button></div><div class="form-grid"><input class="input" id="sku" placeholder="SKU (automatic)" readonly><input class="input" id="name" placeholder="Product Name *"><input class="input" id="brand" placeholder="Brand (Dell / HP / Lenovo)"><input class="input" id="category" placeholder="Category *"><input class="input" id="condition" placeholder="Condition (New / Refurbished / Used)"><input class="input" id="price" type="number" min="0" placeholder="Selling Price"><input class="input" id="mrp" type="number" min="0" placeholder="MRP"><input class="input" id="stock" type="number" min="0" placeholder="Stock"><input class="input" id="warranty" placeholder="Warranty (e.g. 2 Year Warranty)"><input class="input" id="image" placeholder="Main image path (optional)"><label class="upload-box"><span><b>📷 Product Photos</b><small class="muted">Select multiple images at once (PNG/JPG/WEBP/GIF, max 5 MB each)</small></span><input id="imageFiles" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple></label></div><div id="imagePreview" class="image-preview-grid" style="margin-top:12px"></div><div id="imageStatus" class="muted" style="font-size:11px;margin-top:7px"></div><textarea class="input" id="description" style="margin-top:12px" placeholder="Detailed product description"></textarea><textarea class="input" id="highlights" style="margin-top:10px" placeholder="Highlights — one per line"></textarea><textarea class="input" id="specifications" style="margin-top:10px" placeholder="Specifications JSON, e.g. {&quot;Processor&quot;:&quot;Intel Core i5&quot;,&quot;RAM&quot;:&quot;8GB&quot;,&quot;Storage&quot;:&quot;256GB SSD&quot;}"></textarea><button id="saveBtn" class="btn blue" style="margin-top:12px" onclick="saveProduct()">Save Product</button><div id="pm" style="margin-top:10px"></div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>
let editId=null,saving=false,existingImages=[];
const fields=['sku','name','brand','category','condition','price','mrp','stock','warranty','image','description','highlights','specifications'];
function imageList(p){const out=[];if(p?.image)out.push(p.image);if(Array.isArray(p?.images))for(const x of p.images)if(x&&!out.includes(x))out.push(x);return out}
function imageSrc(v){return /^data:image\//i.test(String(v||''))?String(v):'../assets/'+String(v||'products/laptop.svg')}
function renderImagePreview(){const box=$('#imagePreview'),files=[...($('#imageFiles')?.files||[])];box.innerHTML='';if(existingImages.length){box.innerHTML='<div style="grid-column:1/-1;font-weight:900;font-size:12px">Current photos</div>'+existingImages.map((im,i)=>'<div class="image-preview-item"><img src="'+esc(imageSrc(im))+'" alt=""><div><small>Photo '+(i+1)+(i===0?' • Main':'')+'</small><button type="button" class="btn danger" style="padding:5px 8px;margin-top:5px" onclick="removeExistingImage('+i+')">Remove</button></div></div>').join('')}
if(files.length){box.innerHTML+=(existingImages.length?'<div style="grid-column:1/-1;font-weight:900;font-size:12px;margin-top:8px">New photos to upload</div>':'');box.innerHTML+=files.map((f,i)=>'<div class="image-preview-item"><img src="'+esc(URL.createObjectURL(f))+'" alt=""><small>'+esc(f.name)+'</small></div>').join('')}
if(!existingImages.length&&!files.length)box.innerHTML='<div class="muted" style="font-size:11px">No photos selected. A default placeholder will be used.</div>'}
function removeExistingImage(i){existingImages.splice(i,1);if(existingImages[0])$('#image').value=existingImages[0];renderImagePreview()}
function openForm(){editId=null;existingImages=[];fields.forEach(k=>$('#'+k).value='');$('#warranty').value='2 Year Warranty';$('#imageFiles').value='';$('#imageStatus').textContent='';$('#ft').textContent='Add Product';$('#saveBtn').textContent='Save Product';$('#pm').innerHTML='';renderImagePreview();$('#modal').classList.add('open')}
function closeForm(){$('#modal').classList.remove('open');saving=false;$('#saveBtn').disabled=false}
async function loadProducts(){if(!requireAdmin())return;try{const d=await api('/admin/products');render(d.products||[])}catch(e){$('#list').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function render(all){const active=(all||[]).filter(x=>x.active!==0);$('#list').innerHTML=active.length?'<table class="table"><tr><th>Product</th><th>Photos</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>'+active.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><small class="sku-code">'+esc(p.sku)+'</small></td><td>'+imageList(p).length+' photo'+(imageList(p).length===1?'':'s')+'</td><td>'+esc(p.category)+'</td><td>'+money(p.price)+'</td><td><div class="stock-control"><button class="stock-btn minus" onclick="changeStock('+p.id+',-1)">−</button><strong>'+Number(p.stock||0)+'</strong><button class="stock-btn plus" onclick="changeStock('+p.id+',1)">+</button></div></td><td><button class="btn blue" onclick="editProduct('+p.id+')">Edit</button> <button class="btn danger" onclick="deleteProduct('+p.id+')">Delete</button></td></tr>').join('')+'</table>':'<div class="notice">No active products yet. Add your first product.</div>'}
async function editProduct(id){try{const d=await api('/admin/products');const p=(d.products||[]).find(x=>x.id===id);if(!p)return;editId=id;fields.forEach(k=>$('#'+k).value=(k==='highlights'?(Array.isArray(p.highlights)?p.highlights.join('\n'):''):(k==='specifications'?(p.specifications?JSON.stringify(p.specifications,null,2):''):(p[k]??''))));existingImages=imageList(p);$('#ft').textContent='Edit Product';$('#saveBtn').textContent='Update Product';$('#pm').innerHTML='';$('#imageStatus').textContent='';$('#imageFiles').value='';renderImagePreview();$('#modal').classList.add('open')}catch(e){alert(e.message)}}
function readAsDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(Error('Unable to read '+file.name));r.readAsDataURL(file)})}
async function uploadFile(file){if(file.size>5*1024*1024)throw Error(file.name+' is larger than 5 MB');const data=await readAsDataUrl(file);const r=await api('/admin/upload-image',{method:'POST',body:JSON.stringify({data})});return r.filename||''}
async function saveProduct(){if(saving)return;saving=true;const btn=$('#saveBtn');btn.disabled=true;$('#pm').innerHTML='';try{const files=[...($('#imageFiles')?.files||[])],uploaded=[];for(let i=0;i<files.length;i++){if($('#imageStatus'))$('#imageStatus').textContent='Uploading photo '+(i+1)+' of '+files.length+'…';const f=await uploadFile(files[i]);if(f)uploaded.push(f)}const images=[...existingImages,...uploaded];let image=$('#image').value.trim();if(!image&&images[0])image=images[0];let specifications={};const specText=$('#specifications').value.trim();if(specText){try{specifications=JSON.parse(specText);if(!specifications||Array.isArray(specifications)||typeof specifications!=='object')throw Error('Specifications must be a JSON object')}catch(err){throw Error('Specifications JSON is invalid')}}const body={name:$('#name').value.trim(),brand:$('#brand').value.trim(),category:$('#category').value.trim(),condition:$('#condition').value.trim(),price:Number($('#price').value||0),mrp:Number($('#mrp').value||$('#price').value||0),stock:Math.max(0,Number($('#stock').value||0)),warranty:$('#warranty').value.trim()||'2 Year Warranty',image:image||images[0]||'products/laptop.svg',images:images.length?images:[image||'products/laptop.svg'],description:$('#description').value.trim(),highlights:$('#highlights').value.split('\n').map(x=>x.trim()).filter(Boolean),specifications};if(!body.name||!body.category)throw Error('Product name and category are required');if(editId){const saved=await api('/admin/products/'+editId,{method:'PUT',body:JSON.stringify(body)});$('#pm').innerHTML='<div class="notice ok">Product updated: '+esc(saved.sku)+' • '+imageList(saved).length+' photos</div>'}else{body.request_id='product-'+requestId('new');const saved=await api('/admin/products',{method:'POST',body:JSON.stringify(body)});$('#pm').innerHTML='<div class="notice ok">Product added: '+esc(saved.sku)+' • '+imageList(saved).length+' photos</div>'}if($('#imageStatus'))$('#imageStatus').textContent=files.length?'Photo upload complete.':'';await loadProducts();setTimeout(closeForm,650)}catch(e){$('#pm').innerHTML='<div class="notice error">'+esc(e.message)+'</div>';saving=false;btn.disabled=false;$('#imageStatus').textContent=''}}
async function changeStock(id,delta){try{const d=await api('/admin/products');const p=(d.products||[]).find(x=>x.id===id);if(!p)return;const next=Math.max(0,Number(p.stock||0)+delta);await api('/admin/products/'+id,{method:'PUT',body:JSON.stringify({stock:next})});loadProducts()}catch(e){alert(e.message)}}
async function deleteProduct(id){if(!confirm('Delete this product from the customer catalogue?'))return;try{await api('/admin/products/'+id,{method:'DELETE'});loadProducts()}catch(e){alert(e.message)}}
$('#imageFiles')?.addEventListener('change',renderImagePreview);
document.addEventListener('DOMContentLoaded',loadProducts);
</script></body></html>
