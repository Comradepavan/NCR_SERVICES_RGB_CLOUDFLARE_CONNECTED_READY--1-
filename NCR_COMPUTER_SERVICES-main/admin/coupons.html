<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupons | NCR SERVICES</title><link rel="stylesheet" href="../app.css"></head><body class="admin"><header class="header adminbar"><div class="wrap nav"><a class="brand" href="index.html"><img src="../assets/logo.png" alt="NCR ADMIN">NCR SERVICES <span style="font-size:10px;color:#71d9ff">ADMIN</span></a><nav class="navlinks"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="orders.html">Orders</a><a href="services.html">Services</a><a href="categories.html">Categories</a><a href="quotations.html">Quotations</a><a href="settings.html">Settings</a></nav><button class="btn ghost" onclick="adminLogout()">Logout</button></div></header><main class="admin-main"><div class="wrap"><div class="section-head"><div><span class="eyebrow">PROMOTIONS</span><h1>Coupon Codes</h1><p class="muted">Create customer coupon codes with percentage or fixed-amount discounts.</p></div><button class="btn yellow" onclick="openCouponForm()">＋ Add Coupon</button></div><div id="msg"></div><div class="surface" style="padding:18px"><div id="list" class="table-wrap"><div class="loading">Loading coupons…</div></div></div><div id="modal" class="modal"><div class="modal-box"><div class="section-head"><div><span class="eyebrow">COUPON</span><h2 id="ft">Add Coupon</h2></div><button class="btn ghost" onclick="closeCouponForm()">Close</button></div><div class="form-grid"><input class="input" id="code" placeholder="Coupon code e.g. NCR10"><select class="input" id="type"><option value="percent">Percentage discount (%)</option><option value="fixed">Fixed discount (₹)</option></select><input class="input" id="value" type="number" min="0" step="0.01" placeholder="Discount value *"><input class="input" id="minOrder" type="number" min="0" step="0.01" placeholder="Minimum order (₹), optional"><input class="input" id="maxDiscount" type="number" min="0" step="0.01" placeholder="Maximum discount (₹), optional"><input class="input" id="maxUses" type="number" min="0" step="1" placeholder="Maximum uses, 0 = unlimited"><input class="input" id="startsAt" type="datetime-local"><input class="input" id="expiresAt" type="datetime-local"></div><label style="display:flex;align-items:center;gap:8px;margin-top:12px"><input id="active" type="checkbox" checked> <span>Coupon is active</span></label><button id="saveBtn" class="btn blue" style="margin-top:14px" onclick="saveCoupon()">Save Coupon</button><div id="pm" style="margin-top:10px"></div></div></div></div></main><script src="../api-config.js"></script><script src="../app.js?v=12"></script><script>
let editId=null,saving=false;
function openCouponForm(c){editId=c?.id||null;$('#ft').textContent=editId?'Edit Coupon':'Add Coupon';$('#saveBtn').textContent=editId?'Update Coupon':'Save Coupon';$('#code').value=c?.code||'';$('#type').value=c?.type||'percent';$('#value').value=c?.value??'';$('#minOrder').value=c?.min_order??0;$('#maxDiscount').value=c?.max_discount??0;$('#maxUses').value=c?.max_uses??0;$('#startsAt').value=c?.starts_at?String(c.starts_at).slice(0,16):'';$('#expiresAt').value=c?.expires_at?String(c.expires_at).slice(0,16):'';$('#active').checked=c?c.active!==0:true;$('#pm').innerHTML='';$('#modal').classList.add('open')}
function closeCouponForm(){$('#modal').classList.remove('open');saving=false;$('#saveBtn').disabled=false}
async function loadCoupons(){if(!requireAdmin())return;try{const d=await api('/admin/coupons');renderCoupons(d.coupons||[])}catch(e){$('#list').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
function fmtDate(v){return v?new Date(v).toLocaleString('en-IN'): '—'}
function discountText(c){return c.type==='percent'?Number(c.value||0)+'%':money(c.value)}
function renderCoupons(cs){const a=cs||[];$('#list').innerHTML=a.length?'<table class="table"><tr><th>Code</th><th>Discount</th><th>Minimum Order</th><th>Usage</th><th>Expiry</th><th>Status</th><th>Actions</th></tr>'+a.map(c=>'<tr><td><b>'+esc(c.code)+'</b></td><td>'+discountText(c)+(c.type==='percent'&&c.max_discount?' up to '+money(c.max_discount):'')+'</td><td>'+money(c.min_order)+'</td><td>'+Number(c.uses||0)+' / '+(Number(c.max_uses||0)||'∞')+'</td><td>'+esc(fmtDate(c.expires_at))+'</td><td>'+(c.active!==0?'<span class="notice ok" style="display:inline-block;padding:5px 8px">Active</span>':'<span class="notice error" style="display:inline-block;padding:5px 8px">Inactive</span>')+'</td><td><button class="btn blue" onclick="editCoupon('+c.id+')">Edit</button> <button class="btn danger" onclick="deleteCoupon('+c.id+')">Disable</button></td></tr>').join('')+'</table>':'<div class="notice">No coupons yet. Click Add Coupon to create one.</div>'}
async function editCoupon(id){try{const d=await api('/admin/coupons');const c=(d.coupons||[]).find(x=>x.id===id);if(c)openCouponForm(c)}catch(e){alert(e.message)}}
async function saveCoupon(){if(saving)return;saving=true;const b=$('#saveBtn');b.disabled=true;$('#pm').innerHTML='';try{const payload={code:$('#code').value.trim().toUpperCase(),type:$('#type').value,value:Number($('#value').value||0),min_order:Number($('#minOrder').value||0),max_discount:Number($('#maxDiscount').value||0),max_uses:Number($('#maxUses').value||0),active:$('#active').checked,starts_at:$('#startsAt').value?new Date($('#startsAt').value).toISOString():'',expires_at:$('#expiresAt').value?new Date($('#expiresAt').value).toISOString():''};if(!payload.code||!payload.value)throw Error('Coupon code and discount value are required');const path=editId?'/admin/coupons/'+editId:'/admin/coupons';const saved=await api(path,{method:editId?'PUT':'POST',body:JSON.stringify(payload)});$('#pm').innerHTML='<div class="notice ok">Coupon '+esc(saved.code)+' saved.</div>';await loadCoupons();setTimeout(closeCouponForm,500)}catch(e){$('#pm').innerHTML='<div class="notice error">'+esc(e.message)+'</div>';saving=false;b.disabled=false}}
async function deleteCoupon(id){if(!confirm('Disable this coupon code?'))return;try{await api('/admin/coupons/'+id,{method:'DELETE'});loadCoupons()}catch(e){alert(e.message)}}
document.addEventListener('DOMContentLoaded',loadCoupons);
</script></body></html>
